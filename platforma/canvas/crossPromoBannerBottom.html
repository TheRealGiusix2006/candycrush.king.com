<style type='text/css'>
    #KingBlingCrosspromoBottomBanner {
        position: relative;
        top: 0;
        left: 0;
    }

    .kbCrosspromoBottomBannerFindMyId {
        text-decoration: none;
        user-select: text !important;
    }

    .kbCrosspromoBottomBannerFindMyId .myCoreUserId {
        display: none;
        cursor: text;
        font-weight: 700;
    }

    .kbCrosspromoBottomBannerFindMyId .separator {
        color: #07B67F;
    }
</style>

<div id="KingBlingCrosspromoBottomBanner"><img src="/images/banners/CCSS_bottom_banner_gameplay1_BCS-263_en.png" alt="Candy Crush Soda Saga" /></div>

<script type='text/javascript'>
    var GLOBAL_BANNER_UD = 'xpbud';

    function KingBlingCrosspromoBottomBanner(options, bannerUD) {
        var ud = bannerUD || {};

        var init = function() {
            addBlingUserMetrics();
            addInstalledApps();
            addFindMyId();
            tearDown();
        };
        
        var addBlingUserMetrics = function() {
            $('#KingBlingCrosspromoBottomBanner').attr('blingUserMetrics', ud.blingUserMetrics ? JSON.stringify(ud.blingUserMetrics) : 'null');
        };

        var addInstalledApps = function() {
            $('#KingBlingCrosspromoBottomBanner').attr('installedKingAppsIdLastVisitMap', ud.installedKingAppsIdLastVisitMap ? JSON.stringify(ud.installedKingAppsIdLastVisitMap) : '{}');
        };

        var addFindMyId = function() {
            var e;
            var findMyIdName = 'custopsh';
            var findMyIdItem = $('#' + findMyIdName);
            
            if(!findMyIdItem.length) {
                $("#links > a, #footer-right > a")
                    .eq(0)
                    .before('<a href="#" id="' + findMyIdName + '" class="kbCrosspromoBottomBannerFindMyId">' +
                        '<span class="trigger">Find my ID</span>' +
                        '<span class="myCoreUserId">ID: ' + ud.coreUserId + '</span>' +
                    '</a> <span class="separator">|</span> ');
                
                findMyIdItem = $('#' + findMyIdName);
                
                $('.trigger', findMyIdItem).click(function(event) {
                    event.preventDefault();
                    findMyIdItem.removeAttr('href');
                    
                    $('.trigger', findMyIdItem).fadeOut(100, function() {
                        $('.myCoreUserId', findMyIdItem).fadeIn(100);
                    });
                });
            }
            
        };

        var tearDown = function() {
            if (window[GLOBAL_BANNER_UD]) {
                delete window[GLOBAL_BANNER_UD];
            }
        };

        init();
    };

    $(document).ready(function() {
        new KingBlingCrosspromoBottomBanner({}, window[GLOBAL_BANNER_UD]);
    });
</script>
